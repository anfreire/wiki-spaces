name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: uv run --group test pytest -v

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: uv build

      - name: Verify metadata
        run: |
          uv tool run --from twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  smoke:
    name: Smoke-test built wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Install wheel into clean venv
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl

      - name: Import smoke + version
        run: |
          smoke/bin/python -c 'import wiki_spaces; print(wiki_spaces.__version__)'

      - name: Install --all --dry-run
        run: smoke/bin/wiki-spaces install --all --dry-run

      - name: Bridge snippet emits
        run: smoke/bin/wiki-spaces install --bridge cursor > /dev/null

      - name: Packaged --help hides vendor-kepano
        run: |
          # Capture help first so we fail loud if `--help` itself broke.
          # Piping directly into grep would mask a packaged-help crash —
          # grep would see empty input, return 1, and the `if !` would
          # treat the step as passing.
          help_output=$(smoke/bin/wiki-spaces --help)
          if [ -z "$help_output" ]; then
            echo "packaged --help produced no output"
            exit 1
          fi
          if echo "$help_output" | grep -q 'vendor-kepano'; then
            echo "packaged --help should not advertise vendor-kepano"
            exit 1
          fi

      - name: Audit a smoke wiki
        run: |
          mkdir -p smoke-wiki
          printf '# smoke\n\n## Spaces\n\n' > smoke-wiki/index.md
          smoke/bin/wiki-spaces space --wiki "$(pwd)/smoke-wiki" audit

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    # Only publish from a tag ref. `workflow_dispatch` lets us trigger
    # the test+build+smoke pipeline manually (e.g. to verify the wheel
    # without publishing), but the publish step is gated on a real
    # `v*.*.*` tag so a manual dispatch from `main` can't push a wheel.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment:
      name: pypi
      url: https://pypi.org/p/wiki-spaces
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
